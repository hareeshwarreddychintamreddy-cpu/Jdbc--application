<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f5f6fa; }
        h1 { text-align: center; }
        form.add { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
        button { padding: 8px 16px; border: 0; border-radius: 4px; background: #2d6cdf; color: #fff; cursor: pointer; }
        button.del { background: #d9534f; }
        .note { background: #fff; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        .note h3 { margin: 0 0 6px; }
        .note p { margin: 0 0 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>My Notes</h1>

    <form class="add" th:action="@{/add}" th:object="${note}" method="post">
        <input type="text" th:field="*{title}" placeholder="Title" required>
        <textarea th:field="*{content}" rows="3" placeholder="Write your note..."></textarea>
        <button type="submit">Add Note</button>
    </form>

    <div class="note" th:each="n : ${notes}">
        <h3 th:text="${n.title}">Title</h3>
        <p th:text="${n.content}">Content</p>
        <form th:action="@{/delete/{id}(id=${n.id})}" method="post">
            <button class="del" type="submit">Delete</button>
        </form>
    </div>

    <p th:if="${#lists.isEmpty(notes)}" style="text-align:center;color:#777;">No notes yet. Add your first one!</p>
</body>
</html>
